<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<link rel="preload" as="script" crossorigin href="https://unpkg.com/kepler.gl@3.1.10/umd/keplergl.min.js">
<style>
/* One surface for the panel, one for what floats on the map; one text face, a mono face for numbers. */
:root {
  --pw: 400px; --gap: 16px; --r: 10px;
  --bg: #f4f3ef; --surface: #ffffff; --float: rgba(255, 255, 255, .94); --ink: #1a1915; --ink2: #3a362e; --muted: #6a655b;
  --line: rgba(26, 25, 21, .1); --hover: rgba(26, 25, 21, .05); --chip: rgba(26, 25, 21, .07);
  --accent: #0f6e6a; --accent-ink: #ffffff; --worse: #c2284f; --better: #0b8f84; --warn: #b4441c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 16px rgba(0, 0, 0, .08);
  --curve: #1f77b4; --eva: #d62728; --band: rgba(31, 119, 180, .16); --grid: #e7e3d8;
}
body.night {
  --bg: #0b0d10; --surface: #121519; --float: rgba(18, 21, 25, .92); --ink: #e9e7e2; --ink2: #c9c5bc; --muted: #9a968d;
  --line: rgba(255, 255, 255, .09); --hover: rgba(255, 255, 255, .05); --chip: rgba(255, 255, 255, .08);
  --accent: #4cc3b5; --accent-ink: #062521; --worse: #ff4f73; --better: #35e3cb; --warn: #f08a5d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35);
  --curve: #62aee8; --eva: #ff6b6b; --band: rgba(98, 174, 232, .2); --grid: #252a31;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.mono { font-size: 12.5px; }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
svg text { font: 11px "IBM Plex Mono", monospace; fill: var(--muted); }
.ic { width: 16px; height: 16px; flex: none; fill: currentColor; }
.ic.st { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.float { background: var(--float); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* ------------------------------------------------------------------ the map, and what sits in its corners */
#stage { position: fixed; top: 0; left: 0; bottom: 0; right: var(--pw); overflow: hidden; background: var(--bg); }
#map, #app { position: absolute; inset: 0; }
#legend { position: absolute; z-index: 4; left: var(--gap); bottom: 28px; width: 248px; max-height: calc(100% - 80px); overflow: auto; padding: 10px 8px 8px; }
.lg-t { font-weight: 700; font-size: 13px; line-height: 1.3; margin: 0 6px 6px; }
.lg-i { display: grid; grid-template-columns: 12px 1fr auto; gap: 9px; align-items: center; width: 100%; border: 0; background: none; padding: 4px 6px; border-radius: 6px;
  cursor: pointer; text-align: left; font-size: 12.5px; line-height: 1.3; }
.lg-i:hover { background: var(--hover); }
.lg-i i { width: 10px; height: 10px; border-radius: 50%; }
.lg-i b { font: 400 11.5px "IBM Plex Mono", monospace; color: var(--muted); }
.lg-i.on { background: var(--chip); font-weight: 700; }
.lg-i.off { opacity: .4; }
.lg-n { font-size: 11.5px; line-height: 1.4; color: var(--muted); margin: 6px 6px 0; }
.attrib { position: absolute; z-index: 3; left: var(--gap); bottom: 8px; font: 10px "IBM Plex Mono", monospace; color: var(--muted); }

#mapctl { position: absolute; z-index: 4; right: var(--gap); bottom: 36px; display: flex; flex-direction: column; overflow: hidden; }
#mapctl button { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--ink2); font-size: 12px; font-weight: 700; }
#mapctl button + button { border-top: 1px solid var(--line); }
#mapctl button:hover { background: var(--hover); color: var(--ink); }
#mapctl button[aria-pressed="true"] { color: var(--accent); }

#cellcard { position: absolute; z-index: 5; right: var(--gap); top: var(--gap); width: min(420px, calc(100% - 2 * var(--gap) - 260px)); max-height: calc(100% - 190px); min-height: 0;
  overflow: hidden auto; padding: 12px 14px 8px; }
body.tl #cellcard { max-height: calc(100% - 200px); }
.cc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.place h2 { margin: 2px 0 2px; }
.place table td:first-child { color: var(--muted); white-space: nowrap; }
.cc-head h3 { font-size: 17px; margin: 2px 0 0; }
.cc-btns { display: flex; gap: 2px; }
.cc-key { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: 11.5px; color: var(--muted); margin: 0 0 4px; }
.cc-key span { white-space: nowrap; }
#cellcard table td:first-child { color: var(--muted); white-space: nowrap; }
.iconbtn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--muted); }
.iconbtn:hover { background: var(--hover); color: var(--ink); }

#timeline { position: absolute; z-index: 4; left: calc(248px + 2 * var(--gap)); right: calc(36px + 2 * var(--gap)); bottom: 28px; padding: 10px 12px;
  display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center; }
.tl-play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; cursor: pointer; }
.tl-year b { display: block; font: 500 24px/1 "IBM Plex Mono", monospace; }
.tl-year span { display: block; font-size: 11px; color: var(--muted); max-width: 150px; line-height: 1.3; margin-top: 2px; }
.tl-stripes { display: flex; height: 26px; }
.tl-stripes i { flex: 1; cursor: pointer; }
.tl-stripes i:first-child { border-radius: 4px 0 0 4px; }
.tl-stripes i:last-child { border-radius: 0 4px 4px 0; }
.tl-stripes i.on { box-shadow: 0 0 0 2px var(--ink); position: relative; z-index: 1; border-radius: 2px; }
.tl-axis { display: flex; justify-content: space-between; font: 10.5px "IBM Plex Mono", monospace; color: var(--muted); margin-top: 4px; }

#splash { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); transition: opacity .6s, visibility .6s; }
#splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.sp-in { text-align: center; padding: 24px; }
.sp-bar { width: 160px; height: 2px; background: var(--line); border-radius: 2px; margin: 0 auto 12px; overflow: hidden; }
.sp-bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: load 1.3s ease-in-out infinite; }
#splash.failed .sp-bar { display: none; }
.sp-msg { font-size: 13px; color: var(--muted); max-width: 360px; }

/* ------------------------------------------------------------------ the story: letterbox bars and one caption */
.bar { position: absolute; left: 0; right: 0; z-index: 8; height: 52px; background: #050505; color: #f2f0ea; display: flex; align-items: center; gap: 10px;
  padding: 0 20px; visibility: hidden; transition: transform .6s cubic-bezier(.7, 0, .2, 1), visibility 0s .6s; }
.bar.top { top: 0; transform: translateY(-101%); }
.bar.bottom { bottom: 0; transform: translateY(101%); }
body.cinema .bar { transform: none; visibility: visible; transition: transform .6s cubic-bezier(.7, 0, .2, 1); }
.bar button { border: 0; background: none; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; }
.bar button:hover { background: rgba(255, 255, 255, .1); }
.bt-brand { font-weight: 700; font-size: 13px; }
.bt-reg { color: #a9a59b; font-size: 13px; }
.bt-x { margin-left: auto; font-size: 13px; }
kbd { font: 11px "IBM Plex Mono", monospace; border: 1px solid rgba(255, 255, 255, .25); border-radius: 4px; padding: 0 5px; color: #a9a59b; }
.segs { flex: 1; display: flex; gap: 5px; margin: 0 8px; }
.segs button { flex: 1; height: 18px; padding: 7px 0; }
.segs b { display: block; height: 3px; width: 100%; border-radius: 2px; background: rgba(255, 255, 255, .2); overflow: hidden; }
.segs b i { display: block; height: 100%; width: 0; background: #f2f0ea; }
.bt-n { font: 12px "IBM Plex Mono", monospace; color: #a9a59b; min-width: 44px; text-align: right; }
#caption { position: absolute; z-index: 6; left: var(--gap); top: calc(52px + var(--gap)); width: min(560px, calc(100% - 2 * var(--gap))); padding: 16px 18px; display: none; }
body.cinema #caption { display: block; }
#caption h2 { font-size: clamp(22px, 2.4vw, 30px); line-height: 1.12; margin: 6px 0 8px; }
#caption p { margin: 0; font-size: 15px; color: var(--ink2); }
#caption.show { animation: fadeUp .6s ease both; }
body.cinema #stage { right: 0; }
body.cinema #panel { transform: translateX(100%); visibility: hidden; }
body.cinema #mapctl, body.cinema .attrib, body.cinema #cellcard { display: none; }
body.cinema #legend { bottom: calc(52px + var(--gap)); }
body.cinema #timeline { left: auto; right: var(--gap); width: min(560px, calc(100% - 300px)); bottom: calc(52px + var(--gap)); }

/* ------------------------------------------------------------------ the panel */
#panel { position: fixed; z-index: 5; top: 0; right: 0; bottom: 0; width: var(--pw); display: flex; flex-direction: column; background: var(--surface);
  border-left: 1px solid var(--line); transition: transform .4s ease; }
#head { flex: none; padding: 14px 20px 0; }
.brand { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.brand b { font-size: 15px; }
.brand > span { font-size: 12px; color: var(--muted); }
.hd-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; align-self: center; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.lang button { border: 0; background: none; padding: 3px 8px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#aboutBtn { width: 26px; height: 26px; border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
#aboutBtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sel { position: relative; display: block; margin-top: 8px; }
.sel::after { content: "\25BE"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); font-size: 12px; }
#caseSel { appearance: none; -webkit-appearance: none; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer;
  font-size: 14px; padding: 7px 28px 7px 10px; }
#caseSel option { color: #1a1915; background: #fff; }
nav#tabs { flex: none; display: flex; padding: 0 12px; margin-top: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav#tabs button { border: 0; background: none; padding: 10px 8px 9px; cursor: pointer; white-space: nowrap; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav#tabs button:hover { color: var(--ink); }
nav#tabs button .n { font: 11px "IBM Plex Mono", monospace; margin-right: 4px; opacity: .8; }
nav#tabs button.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
#body { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
section { padding: 16px 20px 24px; }
h2 { font-size: 19px; line-height: 1.25; margin: 0 0 6px; }
h3 { font-size: 14px; line-height: 1.3; margin: 20px 0 6px; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  font-size: 13.5px; font-weight: 700; color: var(--ink); background: var(--chip); border: 0; }
.btn:hover { background: var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.wide { width: 100%; margin: 12px 0 4px; }
.btn .dur { font: 12px "IBM Plex Mono", monospace; opacity: .75; }
/* ---- Ask Eva (begin): the chat tab, see detective/agent.py */
.ask-log { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 14px; }
.ask-msg { padding: 10px 12px; border-radius: var(--r); line-height: 1.5; font-size: 14px; }
.ask-msg p { margin: 0 0 8px; } .ask-msg p:last-child { margin-bottom: 0; } .ask-msg ul { margin: 4px 0 8px; padding-left: 18px; }
.ask-msg.user { align-self: flex-end; max-width: 88%; background: var(--accent); color: var(--accent-ink); }
.ask-msg.eva { background: var(--chip); }
.ask-msg.err { background: none; border: 1px solid var(--warn); color: var(--warn); font-size: 13px; }
.ask-msg .ask-show { margin-top: 8px; height: 30px; font-size: 12.5px; }
.ask-form { display: flex; gap: 8px; align-items: flex-end; }
.ask-form textarea { flex: 1; min-height: 44px; max-height: 140px; resize: vertical; font: inherit; font-size: 14px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.ask-wait { color: var(--muted); font-size: 13px; }
/* ---- Ask Eva (end) */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.chip:hover { background: var(--hover); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rows { margin: 10px -8px 12px; }
.row { display: grid; grid-template-columns: 1fr 72px auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 5px 8px; border-radius: 6px; font-size: 13px; }
.row:hover { background: var(--hover); }
.row.on { background: var(--chip); font-weight: 700; }
.row .tb { display: flex; height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.row .tb i { display: block; height: 100%; }
.row .tc { font: 11px "IBM Plex Mono", monospace; color: var(--muted); white-space: nowrap; }
.box { border-radius: 8px; padding: 9px 11px; margin: 10px 0; background: var(--chip); }
.box.warn { background: rgba(180, 68, 28, .12); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.kpi b { display: block; font: 500 20px/1.15 "IBM Plex Mono", monospace; }
.kpi span { display: block; font-size: 11.5px; line-height: 1.35; color: var(--muted); margin-top: 3px; }
.cards { display: grid; gap: 1px; margin: 4px 0 0; border-top: 1px solid var(--line); }
.card { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; padding: 14px 20px 13px; }
.card:hover { background: var(--hover); }
.card-k { display: flex; align-items: center; gap: 7px; }
.card-k i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
.card-n { font: 500 22px/1.2 "IBM Plex Mono", monospace; margin: 6px 0 2px; letter-spacing: -.01em; }
.card-t { font-size: 13.5px; line-height: 1.4; }
.card-s { font-size: 12.5px; line-height: 1.45; color: var(--muted); margin-top: 4px; }
.card-n, .card-t, .card-s { display: block; }
.card-go { display: block; margin-top: 7px; font-size: 12.5px; font-weight: 700; color: var(--accent); }
details.how { margin: 8px 0; }
details.how > summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style-position: inside; }
details.how > summary:hover { color: var(--ink); }
details.more { margin: 0 20px; padding-top: 12px; }
details.more summary { cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--ink2); }
details.more section { padding: 4px 0 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 700; color: var(--muted); font-size: 11.5px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.story li { margin: 6px 0; }
.dist { display: grid; gap: 5px; margin: 8px 0; }
.dist div { display: grid; grid-template-columns: 1fr 110px 32px; gap: 8px; align-items: center; font-size: 12.5px; }
.dist em { display: block; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.dist em i { display: block; height: 100%; }
.dist b { font: 400 11.5px "IBM Plex Mono", monospace; text-align: right; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--accent); }
table.iv { table-layout: fixed; }
table.iv td, table.iv th { padding: 3px 3px; }
table.iv input[type=number] { width: 100%; min-width: 0; font-size: 12px; padding: 2px 3px; -moz-appearance: textfield; appearance: textfield; }
table.iv input[type=number]::-webkit-inner-spin-button, table.iv input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number], input[type=text] { width: 64px; font-size: 13px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); }
label.radio { display: block; margin: 3px 0; font-size: 13.5px; cursor: pointer; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

@media (max-width: 1100px) and (min-width: 861px) {
  :root { --pw: 360px; }
  #timeline { left: var(--gap); }
  body.tl #legend { bottom: 112px; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  #stage { position: relative; right: auto; height: 62vh; min-height: 380px; }
  body.cinema #stage { position: fixed; inset: 0; height: auto; z-index: 20; }
  #panel { position: static; width: auto; border-left: 0; }
  #body { overflow: visible; }
  nav#tabs { position: sticky; top: 0; z-index: 3; background: var(--surface); }
  #legend { width: 200px; max-height: 45%; padding: 6px 4px; }
  .lg-n { display: none; }
  body.tl #legend { display: none; }
  #cellcard { left: 8px; right: 8px; top: 8px; width: auto; max-height: calc(100% - 16px); }
  body.tl #cellcard { max-height: calc(100% - 110px); }
  #timeline { left: 8px; right: 8px; bottom: 8px; grid-template-columns: auto auto 1fr; gap: 10px; }
  #timeline .btn { display: none; }
  .tl-year span { display: none; }
  #caption { left: 8px; width: calc(100% - 16px); padding: 12px 14px; }
  #caption p { font-size: 14px; }
  body.cinema #legend { display: none; }
  body.cinema #timeline { left: 8px; right: 8px; width: auto; }
  .bt-reg, .bar kbd { display: none; }
  .bar { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body class="night">
<div id="stage">
  <div id="map"><div id="app"></div></div>
  <aside id="legend" class="float" hidden aria-label="Legend"></aside>
  <div id="mapctl" class="float" role="toolbar" aria-label="Map"></div>
  <div id="timeline" class="float" hidden></div>
  <div id="cellcard" class="float" hidden></div>
  <div id="caption" class="float" aria-live="polite"></div>
  <div class="bar top" id="barTop"></div>
  <div class="bar bottom" id="barBottom"></div>
  <div class="attrib">kepler.gl · basemap © OpenStreetMap © CARTO</div>
  <div id="splash"><div class="sp-in"><div class="sp-bar"><i></i></div><div class="sp-msg" id="spMsg">Loading the map (internet needed)</div></div></div>
</div>
<aside id="panel">
  <header id="head">
    <div class="brand"><b id="brandName">Land Intelligence</b>
      <span class="hd-tools"><span class="lang" role="group" aria-label="Language / Langue"><button data-lang="fr" lang="fr" title="Français">FR</button><button data-lang="en" lang="en" title="English">EN</button></span><button class="iconbtn" data-tab="about" id="aboutBtn">?</button></span></div>
    <label class="sel"><select id="caseSel" aria-label="Region"></select></label>
  </header>
  <nav id="tabs" aria-label="Steps"></nav>
  <div id="body"></div>
</aside>
<script>
const DATA = /*__DATA__*/null;
const LIBS = ["https://unpkg.com/react@18.3.1/umd/react.production.min.js", "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
  "https://unpkg.com/redux@4.2.1/dist/redux.js", "https://unpkg.com/react-redux@8.1.2/dist/react-redux.min.js",

const ivs = () => S.ivs || (S.ivs = JSON.parse(JSON.stringify(C().budget.interventions)));

    if (S.evidence !== "forecast") { const d = I.cells[key]; if (!d || d[5] !== 1 || d[0] * way <= 0) continue; }
    if (S.evidence === "confirmed" && (ind === "lgp" || ind === "erosivity")) { const r = (c.replication.per_cell[key] || {})[ind]; if (r && r.status === "contradicted") continue; }

}

      .filter(o => o[0] > 0).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const hull = [[0, 0, null]];

async function askSend(q) {

  renderPanel(); paintLegend(); paintTimeline(); cellCard(); tools(); saveHash();
}
function goTo(tab, k, mode) { // a card or a link: switch the view and frame the cells it is about
  S.cell = null; S.tab = tab; S.years = false; S.only = null; stopYears();
  if (tab === "predict") S.pmode = mode || "chance";
  if (k) { if (tab === "detect") S.ind = k; else if (tab === "predict") S.pind = k; else if (tab === "verify") S.vind = k; }
  draw({ grow: true }); $("body").scrollTop = 0;
  if (!ready) return;
  const keys = tab === "detect" ? detKeys(k) : tab === "predict" && S.pmode === "level" ? [] : tab === "predict" ? likelyWorse(k).keys : tab === "act" && lastPlan ? Object.keys(lastPlan.plan) : [];
  flyTo(keys.length >= 3 ? fitCells(keys, { zoomBias: 0.1 }) : homeView(), 1800);
}
function saveHash() {
  if (tour) return;
  const p = new URLSearchParams(); if (S.c) p.set("r", S.c); p.set("tab", S.tab);
  if (S.tab === "detect") p.set("ind", S.ind); if (S.tab === "predict") { p.set("pind", S.pind); if (S.pmode === "level") p.set("pmode", "level"); } if (S.tab === "verify") p.set("vind", S.vind);
  if (S.years) p.set("years", 1); if (S.ground) p.set("ground", 1); if (S.cell) p.set("cell", S.cell); if (!S.d3) p.set("flat", 1); if (!S.night) p.set("day", 1); p.set("lang", S.lang);
  try { history.replaceState(null, "", "#" + p.toString()); } catch (e) { /* file:// in some browsers */ }
}
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1)), r = +p.get("r");
  if (r > 0 && r < DATA.cases.length) S.c = r;
  const ok = k => k && C().indicators[k] ? k : null;
  if ([...TABS, "about"].includes(p.get("tab"))) S.tab = p.get("tab");
  let saved = null; try { saved = localStorage.getItem("lang"); } catch (e) { /* private mode */ }
  const lg = p.get("lang") || saved || ((navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en");
  S.lang = lg === "fr" ? "fr" : "en";
  S.ind = ok(p.get("ind")) || S.ind; S.pind = ok(p.get("pind")) || S.pind; S.vind = ok(p.get("vind")) || S.vind;
  if (p.get("cell") && C().cells[p.get("cell")]) S.cell = p.get("cell");
  if (p.get("flat") === "1") S.d3 = false;
  if (p.get("day") === "1") S.night = false;
  if (p.get("years") === "1" && S.tab === "detect") S.years = true;
  if (p.get("ground") === "1" && S.tab === "detect" && C().ground) S.ground = true;
  if (p.get("pmode") === "level") S.pmode = "level";
  if (p.has("story")) startScene = Math.max(0, (parseInt(p.get("story"), 10) || 1) - 1);
}
function applyNight() {
  document.body.classList.toggle("night", S.night);
  if (themeSet) themeSet(S.night ? null : "light");
  if (store && ready) setStyle();
}
function setLang(l) { // French or English: every word of the page, the map's legend and tooltips
  if (l === S.lang) return;
  S.lang = l; S.only = null; STRIPES = null;
  try { localStorage.setItem("lang", l); } catch (e) { /* private mode */ }
  fillCases(); draw();
}
function newRegion() {
  S.ivs = null; S.sens = null; S.adopt = null; S.cell = null; S.only = null; S.years = false; STRIPES = null; stopYears();
  draw({ grow: true, recentre: true });
}

// ----------------------------------------------------------------- events
document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-y]"); if (!t) return;
  const d = t.dataset;
  if (d.lang) setLang(d.lang);
  else if (d.tab) { S.cell = null; S.tab = d.tab; S.years = false; S.ground = false; S.only = null; stopYears(); draw({ grow: true }); $("body").scrollTop = 0; }
  else if (d.ind) { S.ind = d.ind; S.only = null; if (S.years) S.year = 0; draw({ grow: !S.years }); }
  else if (d.pind) { S.pind = d.pind; S.only = null; draw({ grow: true }); }
  else if (d.pmode) { S.pmode = d.pmode; S.only = null; draw({ grow: true }); }
  else if (d.vind) { S.vind = d.vind; S.only = null; draw(); }
  else if (d.only != null) { S.only = S.only === d.only ? null : d.only; draw(); }
  else if (d.go) { const [tab, k, mode] = d.go.split(":"); goTo(tab, k, mode); }
  else if (d.y != null) { stopYears(); setYear(+d.y); }
  else if (d.scene != null) goScene(+d.scene);
  else if (d.act) act(d.act, t);
});
function act(a, t) {
  if (a === "play") startTour(0);
  else if (a === "tilt") { S.d3 = !S.d3; draw({ recentre: true }); }
  else if (a === "orbit") { S.orbit = !S.orbit; tools(); spin(); }
  else if (a === "night") { S.night = !S.night; STRIPES = null; applyNight(); draw(); }
  else if (a === "home") flyTo(homeView(), 1600);
  else if (a === "years") { S.years = !S.years; S.only = null; stopYears(); if (S.years) { S.year = 0; draw(); playYears(); } else draw({ grow: true }); }
  else if (a === "ytoggle") { if (yearsTimer) stopYears(); else playYears(); }
  else if (a === "closecell") { S.cell = null; draw(); }
  else if (a === "flycell" && S.cell) { const m = ready ? mapNow() : null; flyTo(fitCells([S.cell], { pitch: m ? m.pitch : undefined, bearing: m ? m.bearing : undefined, zoomBias: 0.3 }), 1500); }
  else if (a === "tplay") tourPlay();
  else if (a === "tnext" && tour) goScene(tour.i + 1);
  else if (a === "tprev" && tour) goScene(tour.i - 1);
  else if (a === "texit") endTour();
  else if (a === "region") analyseRegion(t);
  else if (a === "ask") { const b = $("askBox"); askSend(b ? b.value : ASK.draft); }
  else if (a === "askex") askSend(askExamples()[+t.dataset.i]);
  else if (a === "ground") { S.ground = !S.ground && !!C().ground; S.years = false; S.cell = null; S.only = null; stopYears(); draw({ grow: true }); $("body").scrollTop = 0;
    if (S.ground && ready) { const ks = [...new Set(C().ground.patches.map(q => gCell(q[0], q[1])).filter(Boolean))]; flyTo(ks.length >= 3 ? fitCells(ks, { zoomBias: 0.1 }) : homeView(), 1600); } }
  else if (a === "groundfly") { const q = C().ground.patches[+t.dataset.i]; if (q && ready) { const m = mapNow(); flyTo({ latitude: q[0], longitude: q[1], zoom: 10.5, pitch: m.pitch, bearing: m.bearing }, 1600); } }
  else if (a === "askshow") askFocus((ASK.log[+t.dataset.i] || {}).focus || []);
}
async function analyseRegion(go) {
  $("newMsg").textContent = tr("Getting NASA data and analysing (several minutes)…", "Téléchargement des données de la NASA et analyse (plusieurs minutes)…"); go.disabled = true;
  try { const r = await fetch("/api/land", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ region: $("newRegion").value }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText);
    DATA.cases.push(j.case); fillCases(); S.c = DATA.cases.length - 1; $("caseSel").value = S.c; S.tab = "findings"; newRegion();
  } catch (e) { $("newMsg").textContent = tr("Failed: ", "Échec : ") + e.message; go.disabled = false; }
}
document.addEventListener("toggle", e => { if (e.target.id === "assume") S.assume = e.target.open; }, true);
document.addEventListener("input", e => { if (e.target.id === "budget") $("bv").textContent = e.target.value; else if (e.target.id === "askBox") ASK.draft = e.target.value; });
document.addEventListener("keydown", e => { if (e.target.id === "askBox" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askSend(e.target.value); } });
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (el.id === "caseSel") { S.c = +el.value; newRegion(); }
  else if (el.id === "budget") { S.budget = +el.value; draw(); }
  else if (el.name === "ev") { S.evidence = el.value; draw(); }
  else if (d.iv != null) { const v = ivs()[+d.iv]; if (d.f === "cost") v.cost = Math.max(1, +el.value); else v.effects[d.f] = Math.min(1, Math.max(0, +el.value)); draw(); }
  else if (d.sens) { sens()[d.sens] = Math.max(0, +el.value); draw(); }
  else if (el.id === "dcrop") { S.defaultCrop = Math.min(1, Math.max(0, +el.value)); draw(); }
  else if (el.id === "adopt") { S.adopt = Math.min(1, Math.max(0.01, +el.value)); draw(); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  if (tour) {
    if (e.key === "Escape") endTour();
    else if (e.key === " ") { e.preventDefault(); tourPlay(); }
    else if (e.key === "ArrowRight") goScene(tour.i + 1);
    else if (e.key === "ArrowLeft") goScene(tour.i - 1);
    return;
  }
  if (e.key === "Escape") { if (S.cell) { S.cell = null; draw(); } else if (S.years) { S.years = false; stopYears(); draw({ grow: true }); } }
  else if (e.key === " " && S.years) { e.preventDefault(); if (yearsTimer) stopYears(); else playYears(); }
  else if (S.years && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { stopYears(); setYear(S.year + (e.key === "ArrowRight" ? 1 : -1)); }
  else if ((e.key === "o" || e.key === "O") && ready) { S.orbit = !S.orbit; tools(); spin(); }
});
for (const ev of ["pointerdown", "wheel"]) $("map").addEventListener(ev, () => { // the user takes the camera
  stopFly(); if (S.orbit) { S.orbit = false; tools(); } if (tour && tour.playing) tourPlay(false);
}, { capture: true, passive: true });
function fillCases() { $("caseSel").innerHTML = DATA.cases.map((c, i) => `<option value="${i}">${esc(regionName(c))}</option>`).join(""); $("caseSel").value = S.c; }

loadHash();
fillCases();
applyNight();
draw();
$("spMsg").textContent = tr("Loading the map (internet needed)", "Chargement de la carte (internet nécessaire)");
loadLibs(() => { $("spMsg").textContent = tr("Building the map", "Construction de la carte"); try { mountKepler(); } catch (err) { console.error(err); offline(); } }, () => offline());
</script>
</body>
